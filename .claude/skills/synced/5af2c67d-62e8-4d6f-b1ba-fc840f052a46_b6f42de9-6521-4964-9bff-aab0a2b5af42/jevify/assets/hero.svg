<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" aria-labelledby="title desc" role="img" viewBox="0 0 1280 480"><title id="title">Jevify — make intelligence a function call</title><desc id="desc">A skill for discovering fast, affordable decisions with TypeSafe Jev. Research, design questions, compose, evaluate.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1420"/><stop offset="1" stop-color="#152d35"/></linearGradient><radialGradient id="glow"><stop stop-color="#5eeac5" stop-opacity=".18"/><stop offset="1" stop-color="#5eeac5" stop-opacity="0"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path fill="none" stroke="#c8f5e7" stroke-opacity=".045" d="M32 0H0V32"/></pattern></defs><rect width="1280" height="480" fill="url(#bg)" rx="24"/><rect width="1280" height="480" fill="url(#grid)" rx="24"/><ellipse cx="1030" cy="190" fill="url(#glow)" rx="310" ry="290"/><g font-family="Inter, Arial, sans-serif"><rect width="186" height="28" x="64" y="50" fill="#5eeac5" fill-opacity=".1" stroke="#5eeac5" stroke-opacity=".3" rx="14"/><text x="81" y="69" fill="#89f3d5" font-size="11" font-weight="700" letter-spacing="2">AN OPEN AGENT SKILL</text><text x="60" y="174" fill="#f2f6f5" font-size="88" font-weight="800" letter-spacing="-5">Jev<tspan fill="#76f0cd">ify</tspan></text><text x="65" y="222" fill="#d1dedc" font-size="26">Make intelligence a function call.</text><text x="65" y="263" fill="#96adaa" font-size="17">Find the opportunity. Ask the right question.</text><text x="65" y="291" fill="#96adaa" font-size="17">Build with fast, affordable typed decisions.</text><g transform="translate(766 92)"><rect width="446" height="222" fill="#0a171c" stroke="#4b7972" stroke-opacity=".55" rx="16"/><circle cx="23" cy="23" r="4" fill="#ff987f"/><circle cx="39" cy="23" r="4" fill="#f2d486"/><circle cx="55" cy="23" r="4" fill="#76f0cd"/><text x="24" y="70" fill="#9dbab4" font-family="monospace" font-size="16">state + questions</text><path stroke="#31514d" d="M25 90H417"/><text x="24" y="125" fill="#76f0cd" font-family="monospace" font-size="17">Choice</text><text x="160" y="125" fill="#d1dedc" font-size="16">Which one?</text><text x="24" y="162" fill="#76f0cd" font-family="monospace" font-size="17">Noul</text><text x="160" y="162" fill="#d1dedc" font-size="16">Is it true?</text><text x="24" y="199" fill="#76f0cd" font-family="monospace" font-size="17">Score</text><text x="160" y="199" fill="#d1dedc" font-size="16">How much?</text></g><path stroke="#53736e" stroke-opacity=".4" d="M65 354H1214"/><text x="65" y="396" fill="#76f0cd" font-size="12" letter-spacing="1.4">RESEARCH</text><text x="200" y="396" fill="#53736e" font-size="16">→</text><text x="240" y="396" fill="#76f0cd" font-size="12" letter-spacing="1.4">DESIGN QUESTIONS</text><text x="450" y="396" fill="#53736e" font-size="16">→</text><text x="490" y="396" fill="#76f0cd" font-size="12" letter-spacing="1.4">COMPOSE</text><text x="610" y="396" fill="#53736e" font-size="16">→</text><text x="650" y="396" fill="#76f0cd" font-size="12" letter-spacing="1.4">EVALUATE</text><text x="1055" y="397" fill="#f2f6f5" font-size="18" font-weight="700">Thursd<tspan fill="#ff987f">AI</tspan></text><text x="65" y="438" fill="#77918c" font-size="12">CURRENT DOCS + COMMUNITY EXPERIMENTS + YOUR APPLICATION</text></g></svg>